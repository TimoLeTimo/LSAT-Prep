[package]
name = "lsat-prep"
version = "0.1.0"
description = "Offline LSAT-style practice app"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "lsat_prep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
rusqlite = { version = "0.43.0", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"

[dev-dependencies]
tauri = { version = "2.12.7", features = ["test"] }

[profile.release]
# Leave out debugging names. The build scripts in package.json remove folder names.
strip = "symbols"
